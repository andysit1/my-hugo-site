<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Ivory and forest */
  :root {
    color-scheme: light;
    --bg: #FDFCF7;
    --text: #1E2A22;
    --accent: #2F5D46;
    --tile-1: #E2EBE5;
    --tile-2: #F3EFE6;
    --tile-3: #E9E4D6;
    --font-heading: "Instrument Serif", Georgia, "Times New Roman", serif;
    --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.65;
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  p {
    margin: 0 0 1em;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--text);
  }

  h1 { font-size: 2.6rem; }
  h2 { font-size: 2rem; color: var(--accent); }
  h3 { font-size: 1.5rem; color: var(--accent); }

  strong, b {
    color: var(--text);
    font-weight: 700;
  }

  main h2 {
    margin: 1.6em 0 0;
  }

  /* The rule under each section heading: short, green, tucked under the heading. */
  main h2 + hr {
    width: 48px;
    margin: 0.35em 0 1em;
    border-top: 2px solid var(--accent);
  }

  ul, ol {
    margin: 0 0 1em;
    padding-left: 1.3em;
  }

  li {
    margin: 0.3em 0;
  }

  li::marker {
    color: var(--accent);
  }

  em {
    color: var(--accent);
  }

  li > ul, li > ol {
    margin-top: 0.35em;
  }

  header {
    margin-bottom: 0.5em;
  }

  header .title h2 {
    font-size: 2.4rem;
    color: var(--accent);
    margin: 0.4em 0 0.2em;
  }

  a {
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 600;
    border-bottom: none;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: opacity 0.2s ease;
  }

  .title {
    text-decoration: none;
  }

  a:hover {
    opacity: 0.75;
  }

  hr {
    border: none;
    border-top: 1px solid var(--tile-3);
    margin: 1.4em 0;
  }

  nav a {
    position: relative;
    margin-right: 18px;
    padding-bottom: 3px;
    border-bottom: none;
    text-decoration: none;
    font-weight: 500;
    color: var(--text);
  }

  nav {
    margin-bottom: 1.6em;
  }

  nav br {
    display: none;
  }

  nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  nav a:hover,
  nav a:focus-visible {
    opacity: 1;
    color: var(--accent);
  }

  nav a:hover::after,
  nav a:focus-visible::after {
    transform: scaleX(1);
  }

  /* Tiles */
  code {
    background-color: var(--tile-2);
    color: var(--text);
    border-radius: 4px;
  }

  pre code {
    background-color: var(--tile-1);
    color: var(--text);
    border-radius: 10px;
  }

  blockquote {
    background-color: var(--tile-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    color: var(--text);
    margin-left: 0;
    padding: 0.6em 1.2em;
  }

  ul.blog-posts li {
    padding: 0.6em 0.9em;
    border-radius: 10px;
    background-color: var(--tile-1);
  }

  ul.blog-posts li:nth-child(3n + 2) { background-color: var(--tile-2); }
  ul.blog-posts li:nth-child(3n + 3) { background-color: var(--tile-3); }

  .helptext { color: var(--text); opacity: 0.65; }

  textarea, input {
    background-color: var(--tile-2);
    color: var(--text);
    font-family: var(--font-body);
  }

  @media (prefers-color-scheme: dark) {
    body { background-color: var(--bg); color: var(--text); }
    h1, h2, h3, h4, h5, h6, strong, b { color: var(--text); }
    a { color: var(--accent); border-bottom: none; }
    nav a { color: var(--text); }
    code { background-color: var(--tile-2); }
    pre code { color: var(--text); background-color: var(--tile-1); }
    blockquote { color: var(--text); }
    textarea, input { background-color: var(--tile-2); color: var(--text); }
    .helptext { color: var(--text); }
  }

  @media (prefers-reduced-motion: reduce) {
    nav a::after { transition: none; }
    a { transition: none; }
  }
</style>
