<style>
  :root {
    --accent: #CC5500;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  main {
    position: relative;
    z-index: 1;
  }

  h1, h2, h3 {
    letter-spacing: -0.01em;
  }

  main h2 {
    margin-top: 1.8em;
  }

  main h2 + hr {
    margin-top: 0.4em;
  }

  ul, ol {
    padding-left: 1.3em;
  }

  li {
    margin: 0.35em 0;
  }

  li > ul, li > ol {
    margin-top: 0.35em;
  }

  header {
    margin-bottom: 1.2em;
  }

  a {
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }

  a:hover {
    opacity: 0.75;
  }

  nav a {
    position: relative;
    margin-right: 18px;
    padding-bottom: 3px;
    border-bottom: none;
  }

  nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  nav a:hover,
  nav a:focus-visible {
    opacity: 1;
  }

  nav a:hover::after,
  nav a:focus-visible::after {
    transform: scaleX(1);
  }

  /* Softly drifting background blobs; purely decorative. */
  .bg-blobs {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    display: block;
    border-radius: 50%;
    opacity: 0.4;
    will-change: transform;
  }

  .blob-1 {
    width: 480px;
    height: 480px;
    top: -180px;
    left: -160px;
    background: radial-gradient(circle, rgba(204, 85, 0, 1) 0%, rgba(204, 85, 0, 0.85) 10%, rgba(204, 85, 0, 0.68) 20%, rgba(204, 85, 0, 0.5) 30%, rgba(204, 85, 0, 0.34) 40%, rgba(204, 85, 0, 0.2) 50%, rgba(204, 85, 0, 0.09) 60%, rgba(204, 85, 0, 0) 70%);
    animation: float-1 22s ease-in-out infinite;
  }

  .blob-2 {
    width: 400px;
    height: 400px;
    top: 30%;
    right: -160px;
    background: radial-gradient(circle, rgba(255, 157, 92, 1) 0%, rgba(255, 157, 92, 0.85) 10%, rgba(255, 157, 92, 0.68) 20%, rgba(255, 157, 92, 0.5) 30%, rgba(255, 157, 92, 0.34) 40%, rgba(255, 157, 92, 0.2) 50%, rgba(255, 157, 92, 0.09) 60%, rgba(255, 157, 92, 0) 70%);
    animation: float-2 26s ease-in-out infinite;
  }

  .blob-3 {
    width: 360px;
    height: 360px;
    bottom: -140px;
    left: 10%;
    background: radial-gradient(circle, rgba(255, 216, 176, 1) 0%, rgba(255, 216, 176, 0.85) 10%, rgba(255, 216, 176, 0.68) 20%, rgba(255, 216, 176, 0.5) 30%, rgba(255, 216, 176, 0.34) 40%, rgba(255, 216, 176, 0.2) 50%, rgba(255, 216, 176, 0.09) 60%, rgba(255, 216, 176, 0) 70%);
    animation: float-3 30s ease-in-out infinite;
  }

  @keyframes float-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 80px) scale(1.1); }
  }

  @keyframes float-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, 50px) scale(0.9); }
  }

  @keyframes float-3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, -60px) scale(1.05); }
  }

  @media (prefers-color-scheme: dark) {
    .blob-1 { opacity: 0.22; }
    .blob-2 { opacity: 0.18; background: radial-gradient(circle, rgba(255, 138, 61, 1) 0%, rgba(255, 138, 61, 0.85) 10%, rgba(255, 138, 61, 0.68) 20%, rgba(255, 138, 61, 0.5) 30%, rgba(255, 138, 61, 0.34) 40%, rgba(255, 138, 61, 0.2) 50%, rgba(255, 138, 61, 0.09) 60%, rgba(255, 138, 61, 0) 70%); }
    .blob-3 { opacity: 0.16; background: radial-gradient(circle, rgba(255, 178, 107, 1) 0%, rgba(255, 178, 107, 0.85) 10%, rgba(255, 178, 107, 0.68) 20%, rgba(255, 178, 107, 0.5) 30%, rgba(255, 178, 107, 0.34) 40%, rgba(255, 178, 107, 0.2) 50%, rgba(255, 178, 107, 0.09) 60%, rgba(255, 178, 107, 0) 70%); }
  }

  @media (max-width: 480px) {
    .bg-blobs { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    nav a::after { transition: none; }
    a { transition: none; }
  }
</style>
